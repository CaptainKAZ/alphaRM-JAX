<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
      .accent{fill:#eff6ff;stroke:#3b82f6;stroke-width:2.5;rx:14}
      .warn{fill:#fff7ed;stroke:#f97316;stroke-width:2.5;rx:14}
      .t{font-family:DejaVu Sans,Arial,sans-serif;fill:#1f2937}
      .h{font-family:DejaVu Sans,Arial,sans-serif;fill:#0f172a;font-weight:bold}
      .m{font-family:DejaVu Sans,Arial,sans-serif;fill:#475569}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1240" height="560" fill="#ffffff"/>
  <text x="620" y="42" text-anchor="middle" class="h" font-size="25">alphaRM hit-rate pipeline</text>
  <text x="620" y="70" text-anchor="middle" class="m" font-size="14">per shot: geometry → base probability → tracking filter → target-spin multiplier → damage</text>

  <rect x="35" y="110" width="250" height="140" class="box"/>
  <text x="160" y="140" text-anchor="middle" class="h" font-size="16">Inputs</text>
  <text x="55" y="168" class="m" font-size="13">d, |v_self|, ω, p_vis</text>
  <text x="55" y="191" class="m" font-size="13">s_self, s_target</text>
  <text x="55" y="214" class="m" font-size="13">lock time, p_t</text>
  <text x="55" y="237" class="m" font-size="13">angle to target &lt; 1°</text>

  <rect x="345" y="105" width="285" height="150" class="accent"/>
  <text x="487" y="136" text-anchor="middle" class="h" font-size="16">Base factors</text>
  <text x="365" y="166" class="m" font-size="13">p_dist = 1 − ((d−1)/11)²</text>
  <text x="365" y="189" class="m" font-size="13">p_self = 1 − 0.25·min(1,|v|/3)</text>
  <text x="365" y="212" class="m" font-size="13">p_motion = 1/(1+(ω/0.75)²)</text>
  <text x="365" y="235" class="m" font-size="13">p_vis = n_visible / 64</text>

  <rect x="690" y="105" width="255" height="150" class="accent"/>
  <text x="817" y="136" text-anchor="middle" class="h" font-size="16">p_base</text>
  <text x="710" y="170" class="m" font-size="13">p_dist × p_self</text>
  <text x="710" y="193" class="m" font-size="13">× p_motion × p_vis</text>
  <text x="710" y="220" class="m" font-size="13">d ≥ 12 or p_vis = 0 → 0</text>
  <text x="710" y="243" class="m" font-size="13">floor = 0.02</text>

  <rect x="1005" y="105" width="200" height="150" class="warn"/>
  <text x="1105" y="136" text-anchor="middle" class="h" font-size="16">p_ideal</text>
  <text x="1025" y="170" class="m" font-size="13">min(p_base,</text>
  <text x="1025" y="193" class="m" font-size="13">1 − 0.1·s_self)</text>
  <text x="1025" y="220" class="m" font-size="13">own spin caps</text>
  <text x="1025" y="243" class="m" font-size="13">the upper bound</text>

  <rect x="35" y="330" width="280" height="140" class="box"/>
  <text x="175" y="360" text-anchor="middle" class="h" font-size="16">Tracking filter</text>
  <text x="55" y="390" class="m" font-size="13">τ_eff = 0.4·(1 + 0.5·s_target)</text>
  <text x="55" y="413" class="m" font-size="13">α = 1 − exp(−dt/τ_eff)</text>
  <text x="55" y="436" class="m" font-size="13">p_t ← p_t + α·(p_ideal − p_t)</text>
  <text x="55" y="459" class="m" font-size="12">lock lost → p_t = 0</text>

  <rect x="375" y="330" width="300" height="140" class="warn"/>
  <text x="525" y="360" text-anchor="middle" class="h" font-size="16">Final hit probability</text>
  <text x="395" y="392" class="m" font-size="13">p_final = p_t · (1 − 0.4·s_target)</text>
  <text x="395" y="418" class="m" font-size="12">target spinning reduces incoming hit</text>
  <text x="395" y="446" class="m" font-size="13">damage / frame = 30 · p_final</text>

  <rect x="735" y="330" width="300" height="140" class="box"/>
  <text x="885" y="360" text-anchor="middle" class="h" font-size="16">Fire gate</text>
  <text x="755" y="390" class="m" font-size="13">locked target + alive + not overheated</text>
  <text x="755" y="413" class="m" font-size="13">|bearing| &lt; 1° · fire key = 1</text>
  <text x="755" y="436" class="m" font-size="13">heat &lt; 160 · d &lt; 12 m</text>
  <text x="755" y="459" class="m" font-size="13">p_vis &gt; 0 · target not invulnerable</text>

  <path d="M285 180 H338" class="arrow"/>
  <path d="M630 180 H683" class="arrow"/>
  <path d="M945 180 H998" class="arrow"/>
  <path d="M1105 255 V292 H175 V326" class="arrow"/>
  <path d="M315 400 H368" class="arrow"/>
  <path d="M675 400 H728" class="arrow"/>

  <text x="620" y="530" text-anchor="middle" class="m" font-size="12">All values are per shot; the environment fires every frame while the gate is true. p_t is persistent per shooter-target lock.</text>
</svg>
