<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>RM 3v3 · 训练片段观察窗</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --muted:#8b949e;
          --red:#ff5c5c; --blue:#58a6ff; --green:#3fb950; --yellow:#d29922; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font-family:system-ui,"Noto Sans CJK SC",sans-serif; overflow-x:hidden; }
  body { min-height:100dvh; }
  #app { max-width:1600px; margin:0 auto; min-width:0; }
  header { display:flex; gap:12px; align-items:center; padding:10px 14px;
    border-bottom:1px solid var(--line); flex-wrap:wrap; min-width:0; }
  header h1 { font-size:15px; margin:0; font-weight:600; flex:0 0 auto; }
  .pill { padding:3px 9px; border:1px solid var(--line); border-radius:999px;
    color:var(--muted); font-size:12px; white-space:nowrap; max-width:100%; }
  #outcome { overflow:hidden; text-overflow:ellipsis; }
  .score { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .red { color:var(--red); } .blue { color:var(--blue); }
  main { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:12px; padding:12px; }
  #wrap { background:#0a0e14; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; min-width:0; }
  canvas { display:block; width:100%; height:auto; aspect-ratio:3/2; touch-action:manipulation; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px; font-size:13px; min-width:0; }
  aside h2 { font-size:12px; margin:0 0 8px; color:var(--muted); font-weight:600;
    letter-spacing:.02em; }
  .row { display:flex; justify-content:space-between; gap:8px; padding:4px 0;
    border-bottom:1px dashed #21262d; }
  .row:last-child { border-bottom:0; }
  .k { color:var(--muted); } .v { font-variant-numeric:tabular-nums; }
  #clips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  #clips button { background:#21262d; color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:6px 9px; cursor:pointer; font-size:12px; }
  #clips button:hover { background:#30363d; }
  #clips button.active { border-color:var(--blue); background:#1f6feb33; color:var(--blue); }
  #controls { display:flex; gap:8px; align-items:center; padding:0 12px 12px; flex-wrap:wrap; }
  #controls button, #controls select { background:#21262d; color:var(--fg);
    border:1px solid var(--line); border-radius:7px; padding:7px 12px; cursor:pointer; }
  #controls button:hover { background:#30363d; }
  #slider { flex:1 1 220px; min-width:120px; accent-color:var(--blue); }
  #frameLabel { color:var(--muted); font-size:12px; min-width:96px; text-align:right; }
  .tabs { display:flex; gap:8px; align-items:center; padding:9px 14px 0;
    border-bottom:1px solid var(--line); }
  .tabs button { background:transparent; color:var(--muted); border:1px solid transparent;
    border-bottom:0; border-radius:8px 8px 0 0; padding:8px 14px; cursor:pointer;
    font-size:13px; min-height:36px; }
  .tabs button:hover { color:var(--fg); background:#21262d; }
  .tabs button.active { color:var(--fg); background:var(--panel);
    border-color:var(--line); }
  .tabs .tabLink { margin-left:auto; color:var(--blue); font-size:12px;
    text-decoration:none; padding:4px 8px; white-space:nowrap; }
  #view-stats { height:calc(100dvh - 100px); min-height:360px; }
  #statsFrame { display:block; width:100%; height:100%; border:0;
    background:var(--bg); }
  #view-live[hidden], #view-stats[hidden] { display:none !important; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  .warn { color:var(--yellow); font-size:12px; margin:10px 0 0; }
  .muted { color:var(--muted); }
  @media (max-width: 980px) {
    main { grid-template-columns:1fr; }
    aside { order:2; }
    #wrap { order:1; }
  }
  @media (max-width: 700px) {
    header { gap:6px 8px; padding:8px 10px; }
    header h1 { width:100%; font-size:14px; }
    .score { font-size:19px; }
    #controls {
      position:sticky; bottom:0; z-index:10;
      padding:9px 8px calc(9px + env(safe-area-inset-bottom));
      background:rgba(13,17,23,.94); backdrop-filter:blur(8px);
      border-top:1px solid var(--line);
    }
    #controls button, #controls select { min-height:40px; padding:8px 12px; }
    #slider { flex:1 1 100%; order:10; min-height:32px; }
    #frameLabel { order:11; min-width:0; margin-left:auto; }
    main { padding:8px; gap:8px; }
    aside { padding:10px; }
    #clips button { min-height:40px; flex:1 1 calc(50% - 6px); padding:8px; }
  }
  @media (max-width: 560px) {
    header h1 { font-size:13px; }
    .score { font-size:17px; }
    .pill { font-size:11px; padding:2px 7px; }
    main { padding:6px; gap:6px; }
    aside { padding:9px; font-size:12px; }
    .row { padding:5px 0; }
  }
  @media (max-width: 700px) {
    .tabs { padding:7px 8px 0; gap:4px; }
    .tabs button { padding:7px 11px; font-size:12px; min-height:38px; }
    .tabs .tabLink { font-size:11px; padding:4px 5px; }
    #view-stats { height:calc(100dvh - 142px); }
  }
</style>
</head>
<body>
<div id="app">
<header>
  <h1>RM 3v3 · 训练观察窗</h1>
  <span class="pill" id="iter">iter -</span>
  <span class="pill" id="live">训练 -</span>
  <span class="score"><span class="red" id="sr">0.0</span> : <span class="blue" id="sb">0.0</span></span>
  <span class="pill">目标 <b id="target">90</b></span>
  <span class="pill">剩余 <b id="time">180.0</b> s</span>
  <span class="pill" id="outcome">—</span>
  <a class="pill" href="/files" target="_blank" style="color:var(--blue);text-decoration:none">文件 ↗</a>
</header>

<nav class="tabs" aria-label="页面切换">
  <button type="button" id="tabLive" class="active">片段观察</button>
  <button type="button" id="tabStats">训练统计</button>
  <a class="tabLink" href="/stats.html" target="_blank">单独打开统计 ↗</a>
</nav>

<div id="view-live">
<main>
  <div id="wrap"><canvas id="cv" width="960" height="640"></canvas></div>
  <aside>
    <h2>10 个训练片段（点选后慢慢看）</h2>
    <div id="clips"></div>
    <div class="row"><span class="k">当前片段</span><span class="v" id="clipLabel">-</span></div>
    <div class="row"><span class="k">帧</span><span class="v" id="frameNow">0 / 0</span></div>
    <div class="row"><span class="k">红方占点</span><span class="v" id="occR">0</span></div>
    <div class="row"><span class="k">蓝方占点</span><span class="v" id="occB">0</span></div>
    <div class="row"><span class="k">红方存活</span><span class="v" id="aliveR">0</span></div>
    <div class="row"><span class="k">蓝方存活</span><span class="v" id="aliveB">0</span></div>
    <div class="row"><span class="k">红方总血</span><span class="v" id="hpR">0</span></div>
    <div class="row"><span class="k">蓝方总血</span><span class="v" id="hpB">0</span></div>
    <div class="row"><span class="k">红方伤害</span><span class="v" id="dmgR">0</span></div>
    <div class="row"><span class="k">蓝方伤害</span><span class="v" id="dmgB">0</span></div>
    <h2 style="margin-top:14px">机器人</h2>
    <div id="agents"></div>
    <p class="warn" id="note">每轮训练刷新片段；默认 1× 速度，可调 0.25×/0.5×。</p>
  </aside>
</main>

<div id="controls">
  <button id="play">⏸ 暂停</button>
  <select id="speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <label class="pill"><input type="checkbox" id="fov"/> FOV</label>
  <label class="pill"><input type="checkbox" id="obstacles"/> 8向障碍</label>
  <input id="slider" type="range" min="0" max="0" value="0"/>
  <span id="frameLabel">0 / 0</span>
</div>
</div><!-- /view-live -->

<div id="view-stats" hidden>
  <iframe id="statsFrame" data-src="/stats.html?embed=1" title="训练统计"></iframe>
</div>
</div><!-- /app -->

<script>
const FIELD_X = 6.0, FIELD_Y = 4.0, TARGET = 90, EP_TIME = 180.0, HP_MAX = 325.0;
// v1.22 critic/state layout: 6 agents * (22 scalar + 8 obstacle) + 11 global
const AGENT_STRIDE = 30, GLOBAL_OFFSET = 180, AGENT_N = 6;
const OB_OFFSET = 22, OB_N = 8, OB_RANGE = 16.0;
const OB_DIRS = [
  [1,0], [0.70710678,0.70710678], [0,1], [-0.70710678,0.70710678],
  [-1,0], [-0.70710678,-0.70710678], [0,-1], [0.70710678,-0.70710678],
];
const TEAM = ["红", "蓝"];
const COVERS = [
  [[-3.50,-1.00],[-3.30,-1.00],[-3.30,2.86],[-1.50,2.86],[-1.50,3.06],[-3.50,3.06]],
  [[ 3.50, 1.00],[ 3.30, 1.00],[ 3.30,-2.86],[ 1.50,-2.86],[ 1.50,-3.06],[ 3.50,-3.06]],
  [[-1.65,-0.10],[-1.50,-0.10],[-1.50,1.70],[-1.65,1.70]],
  [[ 1.50,-1.70],[ 1.65,-1.70],[ 1.65,0.10],[ 1.50,0.10]],
];
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const slider = document.getElementById("slider");
let data = null, clip = 0, frame = 0, playing = true, speed = 1, lastDataIter = -1;
let holdUntil = 0, clipDone = false;
let VIEW_W = 960, VIEW_H = 640, MARGIN = 34, DPR = 1;

function curClip() {
  return data && data.clips && data.clips[clip] ? data.clips[clip] : null;
}
function worldToPx(x, y) {
  const m = MARGIN;
  return [m + (x + FIELD_X) / (2*FIELD_X) * (VIEW_W - 2*m),
          m + (FIELD_Y - y) / (2*FIELD_Y) * (VIEW_H - 2*m)];
}
const SPAWNS = [
  [[-6,1.5],[-3.5,1.5],[-3.5,4],[-6,4]],
  [[ 3.5,-4],[ 6,-4],[6,-1.5],[3.5,-1.5]],
];
let showFov = false, showObstacles = false;

function poly(pts, fill, stroke, lw=1.5) {
  ctx.beginPath();
  pts.forEach(([x,y],i) => { const [px,py]=worldToPx(x,y); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
  ctx.closePath();
  if (fill) { ctx.fillStyle=fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
}
function disc(x,y,r,fill,stroke,lw=1.5,dash=null) {
  ctx.save(); if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if (fill) { ctx.fillStyle=fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
  ctx.restore();
}
function drawFov(st, i, team) {
  if (!showFov) return;
  const b=i*AGENT_STRIDE, x=st[b+0]*FIELD_X, y=st[b+1]*FIELD_Y;
  const yaw=Math.atan2(st[b+4], st[b+5]);
  const [px,py]=worldToPx(x,y);
  const half=Math.PI/4, L=8*(VIEW_W-2*MARGIN)/12;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(px,py); ctx.arc(px,py,L,-yaw-half,-yaw+half); ctx.closePath();
  ctx.fillStyle = team ? "rgba(88,166,255,.045)" : "rgba(255,92,92,.045)";
  ctx.fill(); ctx.strokeStyle="rgba(139,148,158,.18)"; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function drawArmor(px, py, rad, phase, col) {
  // Four armor-plate line segments tangent to the robot circle.
  ctx.save();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = "round";
  for (let k=0;k<4;k++) {
    const a = phase + k * Math.PI / 2;
    const cx = px + Math.cos(a) * rad;
    const cy = py - Math.sin(a) * rad;
    const tx = -Math.sin(a), ty = -Math.cos(a);
    const half = rad * 0.55;
    ctx.beginPath();
    ctx.moveTo(cx - tx*half, cy - ty*half);
    ctx.lineTo(cx + tx*half, cy + ty*half);
    ctx.stroke();
  }
  ctx.restore();
}

function clipPhase(c) {
  // Integrate spin into an armor-plate phase per frame; spin=1 -> 1.5 rev/s.
  const T = c.state.length;
  const out = Array.from({length:T}, () => new Array(6).fill(0));
  const acc = new Array(6).fill(0);
  for (let t=0;t<T;t++) {
    for (let i=0;i<6;i++) {
      const spin = c.state[t][i*AGENT_STRIDE+9];
      acc[i] += spin * 2 * Math.PI * 1.5 * 0.1;
      out[t][i] = acc[i];
    }
  }
  return out;
}

function drawField() {
  ctx.clearRect(0,0,VIEW_W,VIEW_H);
  ctx.fillStyle = "#0a0e14"; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  const [x0,y0] = worldToPx(-FIELD_X, FIELD_Y);
  const [x1,y1] = worldToPx(FIELD_X, -FIELD_Y);
  ctx.fillStyle = "#121a15"; ctx.fillRect(x0,y0,x1-x0,y1-y0);
  ctx.strokeStyle = "#3a4757"; ctx.lineWidth = 2; ctx.strokeRect(x0,y0,x1-x0,y1-y0);
  ctx.save(); ctx.strokeStyle="rgba(255,255,255,.04)"; ctx.lineWidth=1;
  for (let x=-5;x<=5;x++) { const [a,b]=worldToPx(x,4),[c,d]=worldToPx(x,-4); ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke(); }
  for (let y=-3;y<=3;y++) { const [a,b]=worldToPx(-6,y),[c,d]=worldToPx(6,y); ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke(); }
  ctx.restore();
  poly(SPAWNS[0], "rgba(255,77,94,.07)", "rgba(255,77,94,.35)", 1.5);
  poly(SPAWNS[1], "rgba(77,163,255,.07)", "rgba(77,163,255,.35)", 1.5);
  const [cx,cy] = worldToPx(0,0);
  const [rx,ry] = worldToPx(1.5,0);
  disc(cx,cy,Math.abs(rx-cx),"rgba(200,210,220,.04)","rgba(200,210,220,.45)",2,[8,6]);
  for (const c of COVERS) poly(c, "#2b3442", "#556379", 1.5);
  ctx.font="12px ui-monospace,monospace"; ctx.fillStyle="#8b97a8";
  ctx.fillText("RED SPAWN", x0+10, y0+18);
  ctx.fillText("BLUE SPAWN", x1-96, y1-12);
  ctx.fillStyle="rgba(200,210,220,.6)"; ctx.fillText("CENTER R=1.5", cx-40, cy-Math.abs(ry-cy)-8);
}

function drawObstacleRays(st, i, px, py) {
  if (!showObstacles) return;
  const b = i * AGENT_STRIDE;
  const x = st[b+0]*FIELD_X, y = st[b+1]*FIELD_Y;
  ctx.save();
  ctx.strokeStyle = "rgba(220,228,240,.20)";
  ctx.fillStyle = "rgba(220,228,240,.55)";
  ctx.lineWidth = 1;
  for (let k=0; k<OB_N; k++) {
    const d = st[b + OB_OFFSET + k] * OB_RANGE;
    const [ex,ey] = worldToPx(x + OB_DIRS[k][0]*d, y + OB_DIRS[k][1]*d);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex,ey,1.6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawAgents(st, phase, prevSt) {
  for (let i=0;i<6;i++) {
    const b=i*AGENT_STRIDE;
    const x = st[b+0]*FIELD_X, y = st[b+1]*FIELD_Y;
    const sinY = st[b+4], cosY = st[b+5];
    const hp = st[b+6]*HP_MAX, heat = st[b+7]*160, over = st[b+8] > .5;
    const prevHeat = prevSt ? prevSt[b+7]*160 : null;
    const spin = st[b+9], alive = st[b+10] > .5, inv = st[b+11] > .5;
    const respawn = st[b+13]*5.0;
    const team = st[b+17] > 0.5 ? 1 : 0;
    const target = Math.round(st[b+14]*3);
    const pfin = st[b+21];
    // last_p_final is set only on a real shot in the current step (the
    // environment zeroes it at the start of every step).  Use it rather than
    // a heat-delta heuristic: heat cooling can mask the +15 fire impulse.
    const firing = alive && !inv && !over && target > 0
      && pfin > 1e-4;
    const [px,py] = worldToPx(x,y);
    const rad = 0.30*(VIEW_W-2*MARGIN)/12;
    const col = team ? "#4da3ff" : "#ff4d5e";
    const platePhase = phase ? phase[i] : 0;

    if (!alive) {
      // corpse: yaw + static armor plates + respawn countdown
      disc(px,py,rad*0.9,"#22262e","#6b7280",1.5,[3,3]);
      drawArmor(px,py,rad*0.9,platePhase,"rgba(139,148,158,.55)");
      ctx.save(); ctx.strokeStyle="rgba(200,210,220,.55)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+cosY*rad*1.4, py-sinY*rad*1.4); ctx.stroke(); ctx.restore();
      ctx.fillStyle="#6b7280"; ctx.font="10px ui-monospace,monospace"; ctx.textAlign="center";
      ctx.fillText("DEAD",px,py+3);
      if (respawn > 0.01) {
        ctx.fillStyle="#8b97a8"; ctx.fillText(respawn.toFixed(1)+"s",px,py+rad*0.9+11);
      }
      ctx.textAlign="left";
      continue;
    }

    drawObstacleRays(st, i, px, py);
    drawFov(st,i,team);
    disc(px,py,rad,col==="#4da3ff"?"rgba(77,163,255,.20)":"rgba(255,77,94,.20)",col,2);
    drawArmor(px,py,rad,platePhase,col);
    // spin-state ring: arc length = spin (0..1), in addition to the plates
    if (spin > 0.01) {
      ctx.save(); ctx.strokeStyle="rgba(88,214,141,.85)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(px,py,rad+3,-Math.PI/2,-Math.PI/2+Math.PI*2*spin);
      ctx.stroke(); ctx.restore();
    }
    if (inv) disc(px,py,rad+9,null,"rgba(230,237,243,.85)",2,[3,4]);
    // gimbal yaw
    ctx.save(); ctx.strokeStyle="#ffffff"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+cosY*rad*1.9, py-sinY*rad*1.9); ctx.stroke(); ctx.restore();
    // ONLY firing is yellow: muzzle flash + tracer
    if (firing) {
      ctx.save();
      ctx.strokeStyle="#ffd166"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px+cosY*rad*2.8, py-sinY*rad*2.8); ctx.stroke();
      ctx.fillStyle="#ffd166";
      ctx.beginPath(); ctx.arc(px+cosY*rad*1.7, py-sinY*rad*1.7, 4.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // hp
    const bw=0.78*(VIEW_W-2*MARGIN)/12, bh=5, bx=px-bw/2, by=py-rad-14;
    ctx.fillStyle="#0b0e13"; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle = hp>150 ? "#58d68d" : hp>65 ? "#ff9f43" : "#ff4d5e";
    ctx.fillRect(bx,by,bw*Math.max(0,Math.min(1,hp/HP_MAX)),bh);
    ctx.strokeStyle="#2a3140"; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);
    // heat
    const hy=py+rad+8;
    ctx.fillStyle="#0b0e13"; ctx.fillRect(bx,hy,bw,4);
    ctx.fillStyle = over ? "#ff4d5e" : "#4da3ff";
    ctx.fillRect(bx,hy,bw*Math.max(0,Math.min(1,heat/160)),4);
    // label
    ctx.fillStyle="#dfe6f0"; ctx.font="11px ui-monospace,monospace"; ctx.textAlign="center";
    ctx.fillText(`${i}${team?"B":"R"}`, px, by-4);
    if (firing) ctx.fillText("FIRE", px, py+rad+27);
    // lock line is CYAN, not yellow
    if (target) {
      const enemy = team ? target-1 : 3+target-1;
      const eb = enemy*AGENT_STRIDE;
      const ex = st[eb+0]*FIELD_X, ey = st[eb+1]*FIELD_Y;
      if (st[eb+10] > .5) {
        const [expx,expy] = worldToPx(ex,ey);
        ctx.save(); ctx.setLineDash([5,5]); ctx.strokeStyle="rgba(88,166,255,.38)"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(expx,expy); ctx.stroke(); ctx.restore();
      }
      ctx.fillStyle="#58a6ff"; ctx.font="10px ui-monospace,monospace";
      ctx.fillText(`T${target}`, px, py+rad+39);
    }
    ctx.textAlign="left";
  }
}

function fitCanvas() {
  const wrap = document.getElementById("wrap");
  if (!wrap) return;
  const cssW = Math.max(320, Math.min(1200, Math.floor(wrap.clientWidth || 960)));
  const cssH = Math.round(cssW * 2 / 3);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (cssW === VIEW_W && cssH === VIEW_H && dpr === DPR) return;
  VIEW_W = cssW; VIEW_H = cssH; DPR = dpr;
  MARGIN = Math.max(16, Math.min(34, Math.round(VIEW_W * 0.04)));
  cv.width = Math.round(VIEW_W * DPR);
  cv.height = Math.round(VIEW_H * DPR);
  cv.style.width = "100%";
  cv.style.height = "auto";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (data) render();
}

function fmt(v, d=1) { return Number(v).toFixed(d); }

function rebuildClips() {
  const box = document.getElementById("clips");
  box.innerHTML = "";
  if (!data || !data.clips) return;
  data.clips.forEach((c, i) => {
    const b = document.createElement("button");
    b.textContent = `#${i} · env ${c.env}`;
    b.onclick = () => { clip = i; frame = 0; holdUntil = 0; clipDone = false; render(); };
    if (i === clip) b.className = "active";
    box.appendChild(b);
  });
}

function render() {
  const c = curClip();
  if (!c || !c.state || !c.state.length) return;
  const n = c.state.length;
  frame = Math.max(0, Math.min(frame, n-1));
  slider.max = n-1; slider.value = frame;
  const st = c.state[frame];
  const prevSt = frame > 0 ? c.state[frame-1] : null;
  drawField(); drawAgents(st, c.phase ? c.phase[frame] : null, prevSt);
  const g = st.slice(GLOBAL_OFFSET);
  document.getElementById("sr").textContent = fmt(g[0]*TARGET);
  document.getElementById("sb").textContent = fmt(g[1]*TARGET);
  document.getElementById("time").textContent = fmt(g[2]*EP_TIME);
  document.getElementById("occR").textContent = fmt(g[3]*3,2);
  document.getElementById("occB").textContent = fmt(g[4]*3,2);
  document.getElementById("aliveR").textContent = fmt(g[5]*3,0);
  document.getElementById("aliveB").textContent = fmt(g[6]*3,0);
  document.getElementById("hpR").textContent = fmt(g[7]*3*HP_MAX,0);
  document.getElementById("hpB").textContent = fmt(g[8]*3*HP_MAX,0);
  document.getElementById("dmgR").textContent = fmt(g[9]*1000,0);
  document.getElementById("dmgB").textContent = fmt(g[10]*1000,0);
  document.getElementById("frameNow").textContent = `${frame} / ${n-1}`;
  document.getElementById("frameLabel").textContent = `${frame} / ${n-1}`;
  document.getElementById("clipLabel").textContent = `#${clip} · env ${c.env}`;
  const code = c.codes && c.codes[frame] !== undefined ? c.codes[frame] : 0;
  const name = data.outcome_names && data.outcome_names[String(code)] ? data.outcome_names[String(code)] : (code ? `码 ${code}` : "进行中");
  document.getElementById("outcome").textContent = name;
  const box = document.getElementById("agents");
  box.innerHTML = "";
  for (let i=0;i<6;i++) {
    const b=i*AGENT_STRIDE, team = st[b+17] > .5 ? 1 : 0, alive = st[b+10] > .5;
    const hp = st[b+6]*HP_MAX, spin = st[b+9], pfin = st[b+21];
    const row = document.createElement("div"); row.className="row";
    row.innerHTML = `<span class="k"><span class="dot" style="background:${team?"#58a6ff":"#ff5c5c"}"></span>${i} · ${TEAM[team]}</span>
      <span class="v">${alive?fmt(hp,0):"DEAD"} · s=${fmt(spin,2)} · p=${fmt(pfin,2)}</span>`;
    box.appendChild(row);
  }
  document.querySelectorAll("#clips button").forEach((b,i) => {
    b.className = i === clip ? "active" : "";
  });
}

function applyPayload(j) {
  data = j; lastDataIter = j.iter; clip = 0; frame = 0;
  holdUntil = 0; clipDone = false;
  data.clips.forEach(c => { c.phase = clipPhase(c); });
  document.getElementById("iter").textContent = `iter ${j.iter} · ${j.n_clips} clips`;
  document.getElementById("note").textContent = `每轮训练刷新 10 个片段；当前 ${j.n_clips} 个，可逐个点选。`;
  rebuildClips(); render();
}

async function tick() {
  // 暂停时不拉新数据；当前片段播放完才允许拉新数据。
  if (!playing && lastDataIter >= 0) return;
  if (!clipDone && lastDataIter >= 0) return;
  try {
    const r = await fetch("/rm_live.json?ts=" + Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const j = await r.json();
    if (!j.clips || !j.clips.length) return;
    if (lastDataIter < 0) {
      applyPayload(j);
    } else if (j.iter !== lastDataIter && clipDone) {
      applyPayload(j);
    }
  } catch (e) { /* ignore */ }
}

document.getElementById("play").onclick = () => {
  playing = !playing;
  document.getElementById("play").textContent = playing ? "⏸ 暂停" : "▶ 播放";
};
document.getElementById("speed").onchange = (e) => { speed = +e.target.value; };
document.getElementById("fov").onchange = (e) => { showFov = e.target.checked; render(); };
document.getElementById("obstacles").onchange = (e) => { showObstacles = e.target.checked; render(); };
slider.oninput = () => { frame = +slider.value; holdUntil = 0; clipDone = false; render(); };

function advanceClip() {
  if (data.clips && data.clips.length > 1) {
    clip = (clip + 1) % data.clips.length;
  } else {
    clip = 0;
  }
  frame = 0;
  holdUntil = 0;
  render();
}

function playLoop() {
  const c = curClip();
  if (playing && c && c.state && c.state.length) {
    // done 帧停留 3 秒；普通片段结束不停。
    if (holdUntil) {
      if (performance.now() < holdUntil) {
        setTimeout(playLoop, 100 / Math.max(0.25, speed));
        return;
      }
      holdUntil = 0;
    }
    if (frame + 1 < c.state.length) {
      frame += 1;
      if (c.done && c.done[frame]) {
        holdUntil = performance.now() + 3000;
      }
      render();
    } else {
      // 一个片段播完，允许 tick() 拉取新的 iter/片段。
      clipDone = true;
      advanceClip();
    }
  }
  setTimeout(playLoop, 100 / Math.max(0.25, speed));
}
window.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", () => setTimeout(fitCanvas, 120));
if (window.ResizeObserver) {
  new ResizeObserver(fitCanvas).observe(document.getElementById("wrap"));
}

// 同一页面内切换“片段观察 / 训练统计”；统计页用 iframe 保留独立文件。
const tabLive = document.getElementById("tabLive");
const tabStats = document.getElementById("tabStats");
const viewLive = document.getElementById("view-live");
const viewStats = document.getElementById("view-stats");
const statsFrame = document.getElementById("statsFrame");
function showStats(on, updateHash = true) {
  tabLive.classList.toggle("active", !on);
  tabStats.classList.toggle("active", on);
  viewLive.hidden = on;
  viewStats.hidden = !on;
  if (on && !statsFrame.getAttribute("src")) {
    statsFrame.src = statsFrame.dataset.src;
  }
  if (!on) setTimeout(fitCanvas, 30);
  if (updateHash) {
    history.replaceState(null, "", on ? "#stats" : "#live");
  }
  window.scrollTo(0, 0);
}
tabLive.onclick = () => showStats(false);
tabStats.onclick = () => showStats(true);
window.addEventListener("hashchange", () => showStats(location.hash === "#stats", false));
if (location.hash === "#stats") showStats(true, false);

async function refreshLiveStatus() {
  try {
    const r = await fetch("/status.json?ts=" + Date.now(), {cache:"no-store"});
    if (!r.ok) return;
    const s = await r.json();
    const el = document.getElementById("live");
    if (!el) return;
    if (s.live_iter >= 0) {
      const age = Number.isFinite(s.json_age_s) ? ` · ${Math.max(0, Math.round(s.json_age_s))}s前` : "";
      el.textContent = `训练 iter ${s.live_iter}${age}`;
      el.classList.toggle("warn", Number(s.json_age_s) > 120);
    } else {
      el.textContent = "训练 -";
    }
  } catch (e) { /* ignore */ }
}

setTimeout(fitCanvas, 0);
playLoop();
setInterval(tick, 2000);
setInterval(refreshLiveStatus, 3000);
tick();
refreshLiveStatus();
</script>
</body>
</html>
